components:
  schemas:
    AccountResponse:
      type: object
      properties:
        username:
          type: string
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/AccountTenantItem'
      required:
      - tenants
      - username
    AccountTenant:
      type: object
      properties:
        membership_id:
          type: integer
          readOnly: true
        role:
          $ref: '#/components/schemas/RoleEnum'
        plan_code:
          type: string
          readOnly: true
        max_assets:
          type: integer
          readOnly: true
        max_users:
          type: integer
          readOnly: true
        features:
          readOnly: true
      required:
      - features
      - max_assets
      - max_users
      - membership_id
      - plan_code
    AccountTenantItem:
      type: object
      properties:
        slug:
          type: string
        name:
          type: string
        status:
          type: string
        membership:
          $ref: '#/components/schemas/AccountTenant'
      required:
      - membership
      - name
      - slug
      - status
    Asset:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        model:
          type: integer
        model_name:
          type: string
          readOnly: true
        location:
          type: integer
          nullable: true
        location_name:
          type: string
          readOnly: true
        asset_number:
          type: string
          maxLength: 80
        serial_number:
          type: string
          maxLength: 120
        registration_number:
          type: string
          maxLength: 60
        qr_code:
          type: string
          maxLength: 120
        status:
          allOf:
          - $ref: '#/components/schemas/AssetStatusEnum'
          readOnly: true
        status_changed_at:
          type: string
          format: date-time
          readOnly: true
        current_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        current_kilometers:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        acquired_on:
          type: string
          format: date
          nullable: true
        purchase_cost:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        notes:
          type: string
        created_by:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - asset_number
      - created_at
      - created_by
      - id
      - location_name
      - model
      - model_name
      - status
      - status_changed_at
      - updated_at
    AssetRequest:
      type: object
      properties:
        model:
          type: integer
        location:
          type: integer
          nullable: true
        asset_number:
          type: string
          minLength: 1
          maxLength: 80
        serial_number:
          type: string
          maxLength: 120
        registration_number:
          type: string
          maxLength: 60
        qr_code:
          type: string
          maxLength: 120
        current_hours:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        current_kilometers:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        acquired_on:
          type: string
          format: date
          nullable: true
        purchase_cost:
