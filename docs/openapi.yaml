        notes:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - code
      - compatible_model_codes
      - created_at
      - id
      - location_name
      - name
      - updated_at
    AccessoryRequest:
      type: object
      properties:
        code:
          type: string
